<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__DATE__ · 经济观察</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8f7;color:#202923;font:17px/1.8 system-ui,"Microsoft YaHei",sans-serif}header{background:white;border-bottom:1px solid #dfe5df;padding:38px max(5vw,20px)}.wrap{max-width:1120px;margin:auto}h1{font-size:38px;margin:0}header p{margin:4px 0;color:#68766d}.meta{margin-top:22px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}.badge{background:#195f48;color:white;border-radius:24px;padding:5px 18px}.stats{display:flex;gap:50px;padding:24px 0}.stats b{font-size:34px;display:block;color:#195f48}.stats span{color:#69746d}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px}input,select,button{font:inherit;padding:10px 15px;border:1px solid #d7ded8;border-radius:8px;background:white;color:inherit}input{flex:1;min-width:210px}button{cursor:pointer}main{padding:0 20px 60px}details{background:white;border:1px solid #dee4de;border-radius:12px;margin:20px 0;overflow:hidden}summary{padding:22px 26px;cursor:pointer;font-size:21px;font-weight:650}summary small{float:right;color:#718077;font-size:15px;font-weight:400}.entry{padding:22px 28px;border-top:1px solid #edf0ed}.entry h3{font-size:21px;margin:0 0 8px}.entry a{color:#195f48;text-decoration:none}.entry a:hover{text-decoration:underline}.byline{font-size:14px;color:#68766d}.tags{font-size:14px;color:#476b58;margin-top:8px}.note{color:#68766d;font-size:15px}.empty{padding:10px 28px 26px;color:#78847c}footer{padding:25px 0;color:#78847c;font-size:14px}@media(max-width:650px){h1{font-size:30px}.stats{gap:25px}.stats b{font-size:27px}summary{padding:18px;font-size:18px}.entry{padding:18px}.controls button{flex:1}select{max-width:100%}}</style><header><div class="wrap"><h1>经济观察</h1><p>Economic Observatory · 每日政策与前沿阅读</p><nav style="display:flex;gap:28px;margin-top:20px"><a href="#daily" style="color:#195f48">每日阅读</a><a href="archive.html" style="color:#195f48">历史归档</a></nav><div class="meta"><span class="badge" id="issue"></span><span id="material"></span><select id="day" aria-label="选择期号"></select></div></div></header><main class="wrap" id="daily"><div class="stats"><div><b id="total"></b><span>本期文章</span></div><div><b id="sources"></b><span>覆盖来源</span></div><div><b>每日</b><span>07:00 · 前一日材料</span></div></div><div class="controls"><input id="search" placeholder="搜索标题、来源、关键词…" aria-label="搜索文章"><select id="source" aria-label="筛选来源"></select><button id="expand">展开全部</button><button id="collapse">折叠全部</button></div><p class="note">__NOTICE__</p><div id="groups"></div><section id="history"><h2>历史归档</h2>__ARCHIVE__</section><footer>每日独立保存，历史文章保留原始标题、来源与发布日期。</footer></main><script>const issues=__ISSUES__;const $=s=>document.querySelector(s);function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('#day').innerHTML=issues.map(d=>`<option>${d.date}</option>`).join('');function current(){return issues.find(d=>d.date===$('#day').value)}function category(x){if(Number.isInteger(x.section))return x.section;return /部|局|发展改革委|网信办|人民银行/.test(x.source)&&! /日报|求是/.test(x.source)?1:/人民日报|经济日报|光明日报|求是|新华社/.test(x.source)?0:2}function load(){let d=current();$('#issue').textContent=d.date+' 日刊';$('#material').textContent='材料日期：'+d.material;$('#total').textContent=d.items.length;$('#sources').textContent=new Set(d.items.map(x=>x.source)).size;$('#source').innerHTML='<option value="">全部来源</option>'+[...new Set(d.items.map(x=>x.source))].map(s=>`<option>${esc(s)}</option>`).join('');render()}function render(){let d=current(),q=$('#search').value.trim().toLowerCase(),src=$('#source').value;let items=d.items.filter(x=>(!src||x.source===src)&&[x.title,x.source,...x.keywords].join(' ').toLowerCase().includes(q));$('#groups').innerHTML=['报刊·官方媒体','中央部门·政策与解读','研究机构·深度媒体'].map((name,i)=>{let list=items.filter(x=>category(x)===i);return `<details ${i===0?'open':''}><summary>${name}<small>${list.length} 篇</small></summary>${list.length?list.map(x=>`<article class="entry"><h3><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></h3><div class="byline">${esc(x.source)} · ${x.published} · ${esc(x.type)}</div><div class="tags">${x.keywords.map(esc).join(' · ')}</div><div class="note">${esc(x.verification||'')}</div></article>`).join(''):'<div class="empty">本期尚无已审核文章</div>'}</details>`}).join('')}$('#day').onchange=load;$('#search').oninput=render;$('#source').onchange=render;$('#expand').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=true);$('#collapse').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=false);load();</script></html>
